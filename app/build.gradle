apply plugin: 'com.android.application'

// Release signing comes from keystore.properties in the repo root (storeFile, storePassword,
// keyAlias, keyPassword; storeFile relative to the repo root). It and the keystore are
// gitignored; `just keystore` creates both. Without it, release builds are left unsigned.
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('keystore.properties')
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    defaultConfig {
        // Own applicationId so slopboard installs alongside upstream Simple Keyboard;
        // the Java namespace stays rkr.simplekeyboard.inputmethod to ease upstream merges.
        applicationId "dev.macroslop.slopboard"
        compileSdk 37
        minSdkVersion 24
        targetSdkVersion 37
        versionCode 149
        versionName "1.0.0"
    }
    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix ".debug"
        }
        release {
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    namespace 'rkr.simplekeyboard.inputmethod'

    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }
}

dependencies {
    // Emoji panel behind the emoji key.
    implementation 'androidx.emoji2:emoji2-emojipicker:1.7.0'
}
